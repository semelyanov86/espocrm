# Tasks of the Vtiger 7.1 -> EspoCRM migration repository (go-task v3, https://taskfile.dev).
# Local stand: docs/local-stand.md. Arguments after `--` go to the script: task stand:backup -- --label x
# Names and paths live in deploy/local/stand.conf; the tasks only call scripts.
version: '3'

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  # --- local EspoCRM stand (stage 02) -------------------------------------------------------
  stand:install:
    desc: Install or update the local stand (idempotent); optional step names after --
    cmds:
      - scripts/stand/install.sh {{.CLI_ARGS}}

  stand:health:
    desc: Health check (services, MySQL, EspoCRM, HTTP and login, cron, permissions)
    cmds:
      - scripts/stand/health.sh

  stand:status:
    desc: State of the stand services and of the cron entry
    cmds:
      - scripts/stand/ctl.sh status

  stand:start:
    desc: Start MySQL and PHP-FPM of the stand and restore its cron entry
    cmds:
      - scripts/stand/ctl.sh start

  stand:stop:
    desc: Stop the stand (cron entry removed, PHP-FPM and MySQL stopped)
    cmds:
      - scripts/stand/ctl.sh stop

  stand:restart:
    desc: Restart MySQL and PHP-FPM, reload Apache, then run the health check
    cmds:
      - scripts/stand/ctl.sh restart
      - scripts/stand/health.sh

  stand:logs:
    desc: Recent logs (journal, Apache vhost, EspoCRM); LINES=100 task stand:logs
    cmds:
      - scripts/stand/ctl.sh logs

  stand:backup:
    desc: Local backup into the private directory, writers paused for ~1 s (-- [--label NAME] [--online])
    cmds:
      - scripts/stand/backup.sh {{.CLI_ARGS}}

  stand:backups:
    desc: List local backups
    cmds:
      - scripts/stand/ctl.sh backups

  stand:restore:
    desc: Restore from a local backup (-- <name|dir|latest> [--yes] [--no-safety-backup] [--skip-custom])
    cmds:
      - scripts/stand/restore.sh {{.CLI_ARGS}}

  stand:restore-cleanup:
    desc: Drop leftovers of failed restores (<db>__prev_*/__restore_* databases, .restore-aside-* dirs)
    cmds:
      - scripts/stand/ctl.sh restore-cleanup

  stand:uninstall:
    desc: Remove the stand (-- --yes [--purge]); Git files, private settings and backups stay
    cmds:
      - scripts/stand/uninstall.sh {{.CLI_ARGS}}

  espo:
    desc: EspoCRM console as the web user (-- rebuild | clear-cache | app-check | run-job NAME ...)
    cmds:
      - scripts/stand/espo.sh {{.CLI_ARGS}}

  espo:rebuild:
    desc: Clear cache and rebuild EspoCRM (metadata, DB schema)
    cmds:
      - scripts/stand/espo.sh clear-cache
      - scripts/stand/espo.sh rebuild

  db:shell:
    desc: MySQL shell of the stand database as MySQL root (auth_socket via sudo)
    interactive: true
    cmds:
      - scripts/stand/ctl.sh db-shell

  # --- model, access control and tests (stage 03) ---------------------------------------------
  model:apply:
    desc: Deploy the Itvolga module to the stand (rebuild, roles/teams/tabs, legal entity and counters, settlement of documents, report folders and standard reports, client timestamp)
    cmds:
      - scripts/stand/espo.sh clear-cache
      - scripts/stand/espo.sh rebuild
      - scripts/stand/espo.sh itvolga-setup-acl
      - scripts/stand/espo.sh itvolga-setup-finance
      - scripts/stand/espo.sh itvolga-finance-settle --silent
      - scripts/stand/espo.sh itvolga-setup-reports
      - scripts/stand/espo.sh update-app-timestamp

  model:check:
    desc: Check field-map.csv / relations.csv targets against the merged EspoCRM metadata and that finance-coverage.md is current
    cmds:
      - python3 scripts/model/model_check.py
      - python3 scripts/model/build_finance_coverage.py --check

  model:value-maps:
    desc: Regenerate enum options, labels and the Vtiger value dictionary (-- <private audit dir> [--check])
    cmds:
      - python3 scripts/model/build_value_maps.py {{.CLI_ARGS}}

  maps:build:
    desc: Regenerate field-map.csv and relations.csv from a private audit run (-- <private audit dir>), then finance-coverage.md
    cmds:
      - python3 scripts/audit/build_maps.py {{.CLI_ARGS}} docs/migration
      - python3 scripts/model/build_finance_coverage.py

  finance:coverage:
    desc: Regenerate docs/migration/finance-coverage.md from the maps and the model (stage 04.6; -- --check to verify)
    cmds:
      - python3 scripts/model/build_finance_coverage.py {{.CLI_ARGS}}

  test:stage03:
    desc: Stage 03 acceptance tests on the stand (synthetic data, created and deleted by the run)
    cmds:
      - python3 -m unittest discover -s tests/stage03 -v

  test:stage04:
    desc: Stage 04.2–04.6 acceptance tests on the stand (Quote, SalesOrder, Invoice, Act, items, legal entity, control totals, payments and allocations, the end-to-end chain; synthetic data)
    cmds:
      - python3 -m unittest discover -s tests/stage04 -v

  test:stage05:
    desc: Stage 05 acceptance tests on the stand (print forms of invoices, acts, payments, quotes and sales orders as PDF; synthetic data)
    cmds:
      - python3 -m unittest discover -s tests/stage05 -v

  test:reports:
    desc: Report core tests without the stand (definition rules, calculations, periods, ordering, charts, key metrics, files, mailing schedule; stages 05.1-05.3)
    cmds:
      - php tests/reports/run.php {{.CLI_ARGS}}

  test:stage05.1:
    desc: Stage 05.1 acceptance tests on the stand (reports - engine, access, seed; synthetic data)
    cmds:
      - python3 -m unittest discover -s tests/stage05_1 -v

  test:stage05.2:
    desc: Stage 05.2 acceptance tests on the stand (reports - charts, dashlets, key metrics; synthetic data)
    cmds:
      - python3 -m unittest discover -s tests/stage05_2 -v

  test:stage05.3:
    desc: Stage 05.3 acceptance tests on the stand (reports - export CSV/XLSX/PDF, print view, scheduled mailing, background export; synthetic data)
    cmds:
      - python3 -m unittest discover -s tests/stage05_3 -v

  test:security-key:
    desc: Security key (WebAuthn second factor, D-128) core tests without the stand (base64url, CBOR, COSE keys, signatures, client and authenticator data, counter; keys generated by the run)
    cmds:
      - php tests/security_key/run.php {{.CLI_ARGS}}

  test:security-key-stand:
    desc: Security key acceptance tests on the stand (setup, sign-in, replayed and spoiled answers, Reset, administrator recovery, another method; synthetic users and software keys)
    cmds:
      - python3 -m unittest discover -s tests/security_key_stand -v

  # --- finance contract and calculation core (stage 04.1) --------------------------------------
  test:finance:
    desc: Finance core tests (synthetic structures; the private source snapshot when available, counts only)
    cmds:
      - php tests/finance/run.php {{.CLI_ARGS}}

  finance:profile:
    desc: Rebuild the anonymised source profile of the finance tests (-- <private audit dir>)
    cmds:
      - php tests/finance/build-source-profile.php {{.CLI_ARGS}}

  # --- source audit and repository checks (stage 01) ------------------------------------------
  audit:run:
    desc: Full read-only audit of the Vtiger source (results go to the private directory)
    cmds:
      - scripts/audit/run-audit.sh

  audit:vtiger-src:
    desc: Refresh the private local copy of the Vtiger/SalesPlatform code (no data, secrets or closed extensions)
    cmds:
      - scripts/audit/sync-vtiger-src.sh

  # --- protected source snapshot (stage 06.1, docs/migration/snapshot.md) -----------------------
  snapshot:create:
    desc: Read-only snapshot of Vtiger (DB, files, telephony) into the private directory, verified before publishing
    cmds:
      - python3 scripts/snapshot/snapshot.py create {{.CLI_ARGS}}

  snapshot:verify:
    desc: Verify a snapshot (-- <id> [--no-restore]); restores into a temporary stand database and drops it
    cmds:
      - python3 scripts/snapshot/snapshot.py verify {{.CLI_ARGS}}

  snapshot:list:
    desc: List snapshots, incomplete runs and leftover temporary databases
    cmds:
      - python3 scripts/snapshot/snapshot.py list

  snapshot:delete:
    desc: Delete one snapshot, incomplete run or leftover temporary database by exact name (-- <name> --yes)
    cmds:
      - python3 scripts/snapshot/snapshot.py delete {{.CLI_ARGS}}

  snapshot:protocol:
    desc: Write the anonymised protocol docs/migration/snapshot-protocol.md (-- <id>)
    cmds:
      - python3 scripts/snapshot/snapshot.py protocol {{.CLI_ARGS}}

  test:snapshot:
    desc: Snapshot codec round trip on the stand MySQL (synthetic source, no production)
    cmds:
      - python3 -m unittest discover -s tests/snapshot -v

  check:secrets:
    desc: Scan files that would be committed for secrets and personal data
    cmds:
      - scripts/check-secrets.sh

  check:secrets-history:
    desc: Scan the working tree and the whole Git history (required before every commit)
    cmds:
      - scripts/check-secrets.sh --history

  check:secrets-self-test:
    desc: Self-test of the scanner rules
    cmds:
      - scripts/check-secrets.sh --self-test
