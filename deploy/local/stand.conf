# Local EspoCRM stand (stage 02): non-secret settings, sourced by scripts/stand/*.sh.
# Every value can be overridden from the environment (VAR=... task stand:install).
# Secrets are NOT here: they live in $STAND_PRIVATE_ENV (outside Git, generated on first install,
# template: deploy/local/local.env.example).
# shellcheck shell=bash disable=SC2034

# --- Paths -------------------------------------------------------------------------------------
: "${ESPO_ROOT:=$REPO_ROOT}"                          # EspoCRM root = this repository
: "${STAND_PRIVATE_DIR:=/data/itvolga/espo-private/stand}"
: "${STAND_PRIVATE_ENV:=$STAND_PRIVATE_DIR/local.env}"
: "${BACKUP_DIR:=$STAND_PRIVATE_DIR/backups}"
: "${CACHE_DIR:=$REPO_ROOT/build/cache}"               # downloaded release archives (ignored by Git)
: "${ETC_DIR:=/etc/itvolga-espo}"                      # rendered MySQL/PHP-FPM configs (no secrets)

# --- EspoCRM ---------------------------------------------------------------------------------
# Latest release checked 2026-09-29; requires PHP >=8.3 <8.6, MySQL 8.0+ (docs.espocrm.com).
: "${ESPO_VERSION:=10.0.9}"
: "${ESPO_ZIP:=EspoCRM-$ESPO_VERSION.zip}"
: "${ESPO_ZIP_URL:=https://github.com/espocrm/espocrm/releases/download/$ESPO_VERSION/$ESPO_ZIP}"
# sha256 published by GitHub for the release asset; re-computed locally on 2026-09-29.
: "${ESPO_ZIP_SHA256:=9b53a4f88013155193a5d1052b2108743bd2c93e2075c84febd33c4af17e32e5}"
: "${ESPO_SITE_HOST:=crm.itvolga.test}"
: "${ESPO_SITE_URL:=http://$ESPO_SITE_HOST}"
: "${ESPO_USER:=espocrm}"                              # system user of PHP-FPM workers and cron
: "${DEV_USER:=${SUDO_USER:-$(id -un)}}"               # developer who owns the repository
: "${ESPO_LANGUAGE:=ru_RU}"
: "${ESPO_TIME_ZONE:=Europe/Moscow}"
: "${ESPO_CURRENCY:=RUB}"
: "${ESPO_DATE_FORMAT:=DD.MM.YYYY}"
: "${ESPO_TIME_FORMAT:=HH:mm}"
: "${ESPO_WEEK_START:=1}"
: "${ESPO_DECIMAL_MARK:=,}"
: "${ESPO_THOUSAND_SEPARATOR:= }"
# First-install look, as the owner set it up on the stand (2026-09-29); logo, favicon, footer and login page come
# from the Itvolga module (D-127), not from settings.
: "${ESPO_APPLICATION_NAME:=Центр информационных технологий CRM}"
: "${ESPO_THEME:=Light}"

# --- PHP (same major/minor as the production host: php8.5-fpm 8.5.4, checked 2026-09-29) -----
: "${PHP_VERSION:=8.5}"
: "${PHP_BIN:=/usr/bin/php$PHP_VERSION}"
: "${PHP_FPM_BIN:=/usr/sbin/php-fpm$PHP_VERSION}"
: "${FPM_UNIT:=itvolga-espo-php-fpm}"
: "${FPM_RUN_DIR:=/run/itvolga-espo-php-fpm}"
: "${FPM_SOCKET:=$FPM_RUN_DIR/espocrm.sock}"
: "${FPM_MAX_CHILDREN:=10}"
# EspoCRM parallel jobs (spatie/async) start child processes as plain `php` from PATH; on a
# workstation with several PHP versions that may be another version. Cron and CLI therefore get
# PATH with a `php` -> $PHP_BIN shim first.
: "${STAND_BIN_DIR:=/opt/itvolga-espo/bin}"
: "${STAND_PATH:=$STAND_BIN_DIR:/usr/local/bin:/usr/bin:/bin}"

# --- MySQL (same version as production: 8.4.11, checked 2026-09-29) ----------------------------
: "${MYSQL_VERSION:=8.4.11}"
: "${MYSQL_TARBALL:=mysql-$MYSQL_VERSION-linux-glibc2.28-x86_64-minimal.tar.xz}"
: "${MYSQL_URL:=https://cdn.mysql.com/Downloads/MySQL-8.4/$MYSQL_TARBALL}"
# md5 from cdn.mysql.com and the GPG signature (key below) verified on 2026-09-29, then pinned.
: "${MYSQL_SHA256:=383f54e124d5f325d67f0c6912a8f96814eedc761a17ea30112e52fa4cc6b143}"
: "${MYSQL_GPG_FPR:=BCA43417C3B485DD128EC6D4B7B3B788A8D3785C}" # MySQL Release Engineering
: "${MYSQL_OPT:=/opt/itvolga-espo}"                    # binaries: $MYSQL_OPT/mysql-<ver>, symlink mysql
: "${MYSQL_HOME:=$MYSQL_OPT/mysql}"
: "${MYSQL_DATADIR:=/var/lib/itvolga-espo-mysql}"
: "${MYSQL_UNIT:=itvolga-espo-mysql}"
: "${MYSQL_RUN_DIR:=/run/itvolga-espo-mysql}"
: "${MYSQL_SOCKET:=$MYSQL_RUN_DIR/mysqld.sock}"
: "${MYSQL_HOST:=127.0.0.1}"                           # EspoCRM connects over TCP (no socket option in Espo)
: "${MYSQL_PORT:=3384}"
# Production global sql_mode (non-strict, required by Vtiger on the shared server), checked 2026-09-29.
: "${MYSQL_SQL_MODE:=ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION}"
: "${MYSQL_BUFFER_POOL:=128M}"
: "${MYSQL_MAX_ALLOWED_PACKET:=64M}"
: "${DB_NAME:=espocrm}"
: "${DB_USER:=espocrm}"

# --- Apache / cron ------------------------------------------------------------------------------
: "${APACHE_SITE:=$ESPO_SITE_HOST}"
: "${APACHE_SITE_FILE:=/etc/apache2/sites-available/$APACHE_SITE.conf}"
: "${CRON_FILE:=/etc/cron.d/itvolga-espo}"
: "${CRON_TAG:=itvolga-espo-cron}"                     # syslog tag of cron.php output
