; Simulated providers of the test PBX (stage 07.1): answer the PBX's outbound calls by number, place inbound calls
; from controlled synthetic numbers.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[pbx]
type=aor
contact=sip:pbx:5060

[pbx]
type=endpoint
context=pstn-in
disallow=all
allow=alaw,ulaw
aors=pbx
direct_media=no

[pbx]
type=identify
endpoint=pbx
match=pbx
