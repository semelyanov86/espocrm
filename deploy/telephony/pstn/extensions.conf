; Simulated providers (stage 07.1).
[general]
static=no
writeprotect=yes

; An outbound call of the PBX: AstDB last/called and last/route (the PBX trunk's from_user) for the tests; the
; behaviour from AstDB pstn/<digits> = answer,<ring s>,<talk s> | busy | noanswer | congestion (default answer,1,4).
[pstn-in]
exten => _+X.,1,Set(DB(last/called)=${EXTEN})
 same => n,Set(DB(last/route)=${CALLERID(num)})
 same => n,Goto(${EXTEN:1},3)
exten => _X.,1,Set(DB(last/called)=${EXTEN})
 same => n,Set(DB(last/route)=${CALLERID(num)})
 same => n,Set(B=${IF(${DB_EXISTS(pstn/${EXTEN})}?${DB_RESULT}:answer,1,4)})
 same => n,GotoIf($["${CUT(B,\,,1)}" = "busy"]?busy)
 same => n,GotoIf($["${CUT(B,\,,1)}" = "noanswer"]?noanswer)
 same => n,GotoIf($["${CUT(B,\,,1)}" = "congestion"]?congestion)
 same => n,Ringing()
 same => n,Wait(${CUT(B,\,,2)})
 same => n,Answer()
 same => n,Playtones(350+440)
 same => n,Wait(${CUT(B,\,,3)})
 same => n,Hangup()
 same => n(busy),Busy(10)
 same => n(noanswer),Ringing()
 same => n,Wait(300)
 same => n(congestion),Congestion(5)

; An inbound call into the PBX: Local/<caller>*<line>@call-pbx — the provider delivers <caller> on <line>.
[call-pbx]
exten => _X.,1,Set(CALLERID(all)=<${CUT(EXTEN,*,1)}>)
 same => n,Dial(PJSIP/${CUT(EXTEN,*,2)}@pbx)
