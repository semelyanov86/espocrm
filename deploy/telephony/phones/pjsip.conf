; Simulated desk phones of the test PBX (stage 07.1): every extension registers on the PBX like a real phone; calls
; to it are answered, refused or left ringing as AstDB phone/<ext> says; "desk" places a call from a phone.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[pbx]
type=aor
contact=sip:pbx:5060

[pbx]
type=endpoint
context=ring
disallow=all
allow=alaw,ulaw
aors=pbx
direct_media=no

[pbx]
type=identify
endpoint=pbx
match=pbx

[auth111]
type=auth
auth_type=userpass
username=111
password=example_phone_secret

[reg111]
type=registration
outbound_auth=auth111
server_uri=sip:pbx:5060
client_uri=sip:111@pbx:5060
contact_user=111
retry_interval=5
forbidden_retry_interval=5
max_retries=1000
expiration=300

[as111]
type=endpoint
context=ring
disallow=all
allow=alaw,ulaw
aors=pbx
outbound_auth=auth111
from_user=111
direct_media=no

