; Simulated desk phones (stage 07.1).
[general]
static=no
writeprotect=yes

; A call to a phone: AstDB phone/<ext> = answer,<ring s>,<talk s> | busy | noanswer (default answer,1,4).
[ring]
exten => _X.,1,Set(B=${IF(${DB_EXISTS(phone/${EXTEN})}?${DB_RESULT}:answer,1,4)})
 same => n,GotoIf($["${CUT(B,\,,1)}" = "busy"]?busy)
 same => n,GotoIf($["${CUT(B,\,,1)}" = "noanswer"]?noanswer)
 same => n,Ringing()
 same => n,Wait(${CUT(B,\,,2)})
 same => n,Answer()
 same => n,Playtones(440/500,0/500)
 same => n,Wait(${CUT(B,\,,3)})
 same => n,Hangup()
 same => n(busy),Busy(10)
 same => n(noanswer),Ringing()
 same => n,Wait(300)

; A call from a desk phone: Local/<ext>*<number>@desk — the phone <ext> dials <number> on the PBX.
[desk]
exten => _X.,1,Dial(PJSIP/${CUT(EXTEN,*,2)}@as${CUT(EXTEN,*,1)})
