; Test PBX of the stand (stage 07.1, D-172): the production structure (deploy of /data/server roles/asterisk,
; pjsip.conf.j2) with synthetic names. Trunks lead to the simulated providers (container pstn), desk phones register
; from the container phones. Secrets of the isolated network are placeholders.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- providers (pstn container). trunk-russia: inbound by IP, outbound; trunk-nedost: the second outbound route of
; sub-ifrussia (production: another provider account) — from_user tells the providers which route a call took.
[trunk-russia]
type=aor
contact=sip:pstn:5060

[trunk-russia]
type=endpoint
context=call-in
disallow=all
allow=alaw,ulaw
aors=trunk-russia
from_user=russia
trust_id_inbound=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[trunk-russia]
type=identify
endpoint=trunk-russia
match=pstn

[trunk-nedost]
type=aor
contact=sip:pstn:5060

[trunk-nedost]
type=endpoint
context=call-in
disallow=all
allow=alaw,ulaw
aors=trunk-nedost
from_user=nedost
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ---- desk phones: endpoint + auth + aor with one name, as in production (callerid "<ext>" <ext>)

[111]
type=endpoint
context=call-out
disallow=all
allow=alaw,ulaw
auth=111
aors=111
callerid="111" <111>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[111]
type=auth
auth_type=userpass
username=111
password=example_phone_secret

[111]
type=aor
max_contacts=1
remove_existing=yes

