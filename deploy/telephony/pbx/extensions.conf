; Test PBX of the local stand (stage 07.1, D-172): the structure of the production dialplan (role asterisk of
; /data/server, extensions.conf.j2; contexts checked read-only on the server 2026-10-13) with synthetic numbers and
; short timeouts. Kept: call-out / call-in, phones-local / phones-out / phones-in, incoming-menu with its timeout,
; chose-client (the sequential ring of desk phones and the failover to a mobile through a trunk), sub-monitor
; (MixMonitor into /var/spool/asterisk/monitor/YYYY/MM/DD, CDR(recordingpath)) and sub-ifrussia (the trunk chosen by
; CALLERID(num)). Left out: the German trainer, the fax, voicemail and the conference bridge (answered and hung up),
; the SHELL checks of premium numbers, jitter buffers and recording post-processing.
;
; Production → stand: desk phones 105 → 111, 100 → 112, 110 → 113, 108 → 118, 208 → 218, 106 → 116, 206 → 216, 107 → 117; the
; second route of sub-ifrussia is trunk-nedost; the mobile failover number and every external number are synthetic.

[general]
static=no
writeprotect=yes
autofallthrough=yes

[globals]
Infolink=trunk-russia
ZadarmaAll=trunk-russia
ZadarmaNedost=trunk-nedost
ZadarmaPRK=trunk-russia
MobFailover=+90009999
Dialoptions=tm
DialoptionsTr=wWtT
Dialtime=20
Predialtime=6

[default]
exten => _X.,1,Hangup()

[call-out]
include => phones-local
include => phones-out
include => end

exten => h,1,Hangup()

[call-in]
include => phones-in
include => end

[sub-monitor]
exten => s,1,Set(Filename=${STRFTIME(${EPOCH},,%Y.%m.%d_%H-%M)}_From.${CALLERID(number)}_To.${Exten})
 same => n,Set(Recdir=/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,System(/bin/mkdir -p ${Recdir})
 same => n,MixMonitor(${Recdir}/${Filename}.wav)
 same => n,Set(CDR(recordingpath)=${Recdir}/${Filename}.wav)
 same => n,Return()

[sub-ifrussia]
exten => s,1,NoOp(if russia)
 same => n,GotoIf($[$["${CALLERID(num)}" = "111"] || $["${CALLERID(num)}" = "112"]]?nedost)
 same => n,GotoIf($["${CALLERID(num)}" = "113"]?prkpk)
 same => n,Dial(PJSIP/${Exten}@${Infolink},,${DialoptionsTr})
 same => n,Goto(ends)
 same => n(nedost),Dial(PJSIP/${Exten}@${ZadarmaNedost},,${DialoptionsTr})
 same => n,Goto(ends)
 same => n(prkpk),Dial(PJSIP/${Exten}@${ZadarmaPRK},,${DialoptionsTr})
 same => n(ends),Return()

[phones-local]
include => mail
include => conf-room

exten => _[12][01]X,1,NoOp(from-in - (${CALLERID(num)}) : to - (${EXTEN}))
 same => n,Set(Exten=${EXTEN})
 same => n,GoSub(sub-monitor,s,1)
 same => n,Dial(PJSIP/${Exten},${Dialtime},${Dialoptions})
 same => n,Hangup()

exten => 118,1,NoOp(from-in - (${CALLERID(num)}) : to - (${EXTEN}))
 same => n,Set(Exten=${EXTEN})
 same => n,GotoIf($[$["${DEVICE_STATE(PJSIP/118)}" = "BUSY"] | $["${DEVICE_STATE(PJSIP/118)}" = "UNAVAILABLE"]]?local218)
 same => n,GoSub(sub-monitor,s,1)
 same => n,Dial(PJSIP/118,${Predialtime},${Dialoptions})
 same => n(local218),GotoIf($[$["${DEVICE_STATE(PJSIP/218)}" = "BUSY"] | $["${DEVICE_STATE(PJSIP/218)}" = "UNAVAILABLE"]]?mob)
 same => n,Dial(PJSIP/218,${Predialtime},${Dialoptions})
 same => n(mob),NoOp(Call mobile failover)
 same => n,Dial(PJSIP/${MobFailover}@${ZadarmaNedost},${Dialtime},${Dialoptions})
 same => n(end),Hangup()

[mail]
exten => 808,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()

[conf-room]
exten => 811,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()

[end]
exten => ending,1,Hangup()

[chose-client]
exten => t,1,NoOp(timeout - ring the phones)
 same => n,Set(Exten=${Extenin})
 same => n,GoSub(sub-monitor,s,1)
 same => n,Dial(PJSIP/118,${Predialtime},${Dialoptions})
 same => n,Dial(PJSIP/218,${Predialtime},${Dialoptions})
 same => n,Dial(PJSIP/${MobFailover}@${ZadarmaNedost},${Predialtime},${Dialoptions})
 same => n,Dial(PJSIP/116,${Predialtime},${Dialoptions})
 same => n,Dial(PJSIP/216,${Predialtime},${Dialoptions})
 same => n,Dial(PJSIP/117,${Predialtime},${Dialoptions})
 same => n,Hangup()

exten => i,1,NoOp(invalid)
 same => n,Goto(t,1)

[phones-out]
exten => _0[1-689]XXXX.,1,NoOp(Other country (from: ${CALLERID(num)}) - (to: ${EXTEN}))
 same => n,Set(Exten=+${EXTEN:1})
 same => n,GoSub(sub-monitor,s,1)
 same => n,Dial(PJSIP/${Exten}@${ZadarmaAll},,${DialoptionsTr})
 same => n(end),Hangup()

exten => _+7XXXXXXXXXX,1,NoOp((from: ${CALLERID(num)}) - (to: ${EXTEN}))
 same => n,Set(Exten=${EXTEN})
 same => n,GoSub(sub-monitor,s,1)
 same => n,GoSub(sub-ifrussia,s,1)
 same => n,Hangup()

exten => _[78]XXXXXXXXXX,1,NoOp((from: ${CALLERID(num)}) - (to: ${EXTEN}))
 same => n,Set(Exten=+7${EXTEN:1})
 same => n,GoSub(sub-monitor,s,1)
 same => n,GoSub(sub-ifrussia,s,1)
 same => n,Hangup()

exten => _+78352XXXXXX,1,NoOp((from: ${CALLERID(num)}) - (to: ${EXTEN}))
 same => n,Set(Exten=${EXTEN})
 same => n,GoSub(sub-monitor,s,1)
 same => n,Dial(PJSIP/${EXTEN}@${Infolink},,${DialoptionsTr})
 same => n,Hangup()

exten => _[78]8352XXXXXX,1,NoOp((from: ${CALLERID(num)}) - (to: ${EXTEN}))
 same => n,Set(Exten=+7${EXTEN:1})
 same => n,GoSub(sub-monitor,s,1)
 same => n,Dial(PJSIP/${Exten}@${Infolink},,${DialoptionsTr})
 same => n,Hangup()

exten => _XXXXXX,1,NoOp((from: ${CALLERID(num)}) - (to: ${EXTEN}))
 same => n,Set(Exten=78352${EXTEN})
 same => n,GoSub(sub-monitor,s,1)
 same => n,Dial(PJSIP/${Exten}@${Infolink},,${DialoptionsTr})
 same => n,Hangup()

[phones-in]
exten => _X.,1,NoOp(Inbound DID ${EXTEN} from (${CALLERID(num)}))
 same => n,Set(Extenin=${EXTEN})
 same => n,Answer()
 same => n,Goto(incoming-menu,s,1)

exten => s,1,NoOp(Inbound (no DID) from (${CALLERID(num)}))
 same => n,Set(Extenin=${EXTEN})
 same => n,Answer()
 same => n,Goto(incoming-menu,s,1)

[incoming-menu]
exten => s,1,Wait(1)
 same => n,WaitExten(2)

include => phones-local
include => chose-client
