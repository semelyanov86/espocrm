---
# Disposable test target (scripts/deploy/test-target.sh): the container itvolga-espo-ansible-target over the Docker
# connection. The host keeps the name of the production inventory, the playbooks are the same.
all:
  hosts:
    new_server:
      ansible_connection: community.docker.docker
      ansible_host: itvolga-espo-ansible-target
      ansible_user: root
      ansible_python_interpreter: /usr/bin/python3
