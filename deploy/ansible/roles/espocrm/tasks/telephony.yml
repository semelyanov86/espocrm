---
# Чтение записей разговоров пользователем EspoCRM — ACL одного пользователя, не членство в группе asterisk (та
# читает /etc/asterisk с секретами SIP); default ACL покрывает каталоги, которые Asterisk создаёт позже (D-171).
# Нужно и без живой интеграции: прослушивание истории звонков.
- name: Stat the recordings directory of Asterisk
  ansible.builtin.stat:
    path: "{{ espocrm_recordings_dir }}"
  register: espocrm_recordings_stat

# Родитель корня записей на production — asterisk:root 0750 (проверено только чтением 2026-10-17): без права
# прохода ACL самого корня не работает. Только проход (--x): содержимое /var/spool/asterisk не читается.
- name: Let the EspoCRM user traverse the parent of the recordings directory
  ansible.posix.acl:
    path: "{{ espocrm_recordings_dir | dirname }}"
    entity: "{{ espocrm_user }}"
    etype: user
    permissions: x
    state: present
  when: espocrm_recordings_stat.stat.exists

- name: Grant the EspoCRM user read access to the recordings
  ansible.posix.acl:
    path: "{{ espocrm_recordings_dir }}"
    entity: "{{ espocrm_user }}"
    etype: user
    permissions: rx
    default: "{{ item }}"
    state: present
  loop: [false, true]
  loop_control:
    label: "{{ 'default ACL' if item else 'ACL' }}"
  when: espocrm_recordings_stat.stat.exists

# Настройки интеграции EspoCRM (itvolga-setup-telephony, JSON через stdin): учётки AMI, правила, корень записей,
# запасной внутренний номер (только если в EspoCRM он не задан). Файл 0600 root — те же секреты, что в
# config-internal.php. Применяются, когда файл отличается от последнего успешно применённого (sha256 в
# /var/lib/espocrm/telephony-applied): прерванный прогон применит их следующим запуском.
- name: Deploy the telephony settings of EspoCRM
  ansible.builtin.template:
    src: telephony.json.j2
    dest: "{{ espocrm_telephony_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Read the checksum of the telephony settings
  ansible.builtin.stat:
    path: "{{ espocrm_telephony_file }}"
    checksum_algorithm: sha256
  register: espocrm_telephony_desired

- name: Read the last applied telephony settings
  ansible.builtin.slurp:
    src: "{{ espocrm_applied_telephony }}"
  register: espocrm_telephony_applied
  failed_when: false

- name: Apply the telephony settings of EspoCRM
  ansible.builtin.shell:
    cmd: "{{ espocrm_sbin_dir }}/espocrm itvolga-setup-telephony < {{ espocrm_telephony_file }}"
  when:
    - not ansible_check_mode
    - (espocrm_telephony_applied.content | default('') | b64decode | trim) != espocrm_telephony_desired.stat.checksum
  changed_when: true
  register: espocrm_telephony_set

- name: Record the applied telephony settings
  ansible.builtin.copy:
    content: "{{ espocrm_telephony_desired.stat.checksum }}\n"
    dest: "{{ espocrm_applied_telephony }}"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode

# Живая интеграция: два пользователя AMI с минимальными правами (manager reload, без рестарта Asterisk; диалплан
# и транки не меняются), служба слушателя. Выключена — файла пользователей нет, служба остановлена. Reload —
# задачей, до старта слушателя и самопроверки (обработчик выполнился бы только в конце play).
- name: Deploy the AMI users of EspoCRM
  ansible.builtin.template:
    src: manager.d-itvolga-espo.conf.j2
    dest: "{{ espocrm_ami_file }}"
    owner: root
    group: "{{ espocrm_asterisk_group }}"
    mode: "0640"
  when: espocrm_telephony_enabled | bool
  register: espocrm_ami_written
  no_log: true

- name: Remove the AMI users of EspoCRM
  ansible.builtin.file:
    path: "{{ espocrm_ami_file }}"
    state: absent
  when: not (espocrm_telephony_enabled | bool)
  register: espocrm_ami_removed

- name: Reload the Asterisk manager after a change of the AMI users
  ansible.builtin.shell:
    cmd: if systemctl is-active --quiet asterisk; then asterisk -rx "manager reload"; fi
  when: espocrm_ami_written is changed or espocrm_ami_removed is changed
  changed_when: true

- name: Deploy the unit of the AMI listener
  ansible.builtin.template:
    src: espocrm-telephony.service.j2
    dest: "/etc/systemd/system/{{ espocrm_telephony_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  register: espocrm_telephony_unit_file

# Слушатель читает правила и учётки AMI только при старте: после их смены (и после применения модуля) — рестарт.
- name: Set the state of the AMI listener
  ansible.builtin.systemd:
    name: "{{ espocrm_telephony_unit }}"
    state: >-
      {{ ('restarted' if (espocrm_telephony_unit_file is changed or espocrm_telephony_set is changed
                          or espocrm_ami_written is changed or espocrm_module_applied is changed) else 'started')
         if espocrm_telephony_enabled | bool else 'stopped' }}
    enabled: "{{ espocrm_telephony_enabled | bool }}"
    daemon_reload: "{{ espocrm_telephony_unit_file is changed }}"

# Самопроверка прав AMI (коды, без значений): слушатель — список каналов да, Originate нет; набор — Command,
# Hangup и список каналов нет (telephony.md).
- name: Check the AMI rights of the EspoCRM users
  ansible.builtin.command:
    cmd: "{{ espocrm_sbin_dir }}/espocrm itvolga-setup-telephony --check"
  register: espocrm_ami_check
  changed_when: false
  when:
    - espocrm_telephony_enabled | bool
    - not ansible_check_mode
