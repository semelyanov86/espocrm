---
# Модуль Itvolga — содержимое коммита репозитория миграции (git archive на контроллере), а не рабочего каталога:
# незакоммиченные правки на сервер не попадают. Архив детерминирован (те же байты для того же коммита), поэтому
# копирование идемпотентно. Код модуля на сервере принадлежит root: EspoCRM его не меняет.
- name: Resolve the module ref to a commit on the controller  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [git, -C, "{{ espocrm_module_repo }}", rev-parse, --verify, "{{ espocrm_module_ref }}^{commit}"]
  delegate_to: localhost
  become: false
  run_once: true
  register: espocrm_module_rev
  changed_when: false
  check_mode: false

- name: Remember the module commit
  ansible.builtin.set_fact:
    espocrm_module_commit: "{{ espocrm_module_rev.stdout | trim }}"
    espocrm_module_tar: "itvolga-module-{{ espocrm_module_rev.stdout | trim }}.tar"
    espocrm_module_stage: "{{ espocrm_opt_dir }}/module/{{ espocrm_module_rev.stdout | trim }}"

# Только каталоги и обычные файлы: rsync от root прошёл бы по символической ссылке на месте каталога модуля (косая
# черта в конце источника) и скопировал бы файлы вне коммита; подмодуль в архиве пуст. Так же проверяет espocrm-deploy.
- name: List symbolic links and submodules of the module in the commit  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      for p in {{ espocrm_module_paths | map('quote') | join(' ') }}; do
      test "$(git -C {{ espocrm_module_repo | quote }} cat-file -t {{ espocrm_module_commit }}:"$p")" = tree
      || echo "not a directory: $p"; done;
      git -C {{ espocrm_module_repo | quote }} ls-tree -r {{ espocrm_module_commit }} --
      {{ espocrm_module_paths | map('quote') | join(' ') }} | awk '$1 == "120000" || $2 == "commit"'
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  register: espocrm_module_links
  changed_when: false
  check_mode: false

- name: Refuse symbolic links and submodules in the module
  ansible.builtin.assert:
    that:
      - espocrm_module_links.stdout | length == 0
    fail_msg: "Коммит {{ espocrm_module_commit[:12] }}: в модуле символические ссылки или подмодули — не выкладывается."
    quiet: true

# CD (D-194) выкладывает коммиты main с GitHub: роль из отставшей рабочей копии вернула бы модуль назад. Развёрнутый
# коммит должен быть предком выкладываемого (или им самим); неизвестный контроллеру — git pull. Намеренный откат —
# -e espocrm_module_allow_downgrade=true.
- name: Read the deployed module commit
  ansible.builtin.slurp:
    src: "{{ espocrm_root }}/.itvolga-module"
  register: espocrm_module_deployed_stamp
  failed_when: false

- name: Remember the deployed module commit
  ansible.builtin.set_fact:
    espocrm_module_deployed: "{{ espocrm_module_deployed_stamp.content | default('') | b64decode | trim }}"

- name: Check that the deployed module commit is in the history of the commit to deploy  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [git, -C, "{{ espocrm_module_repo }}", merge-base, --is-ancestor, "{{ espocrm_module_deployed }}",
           "{{ espocrm_module_commit }}"]
  delegate_to: localhost
  become: false
  register: espocrm_module_ancestry
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - espocrm_module_deployed is match('^[0-9a-f]{40}$')
    - espocrm_module_deployed != espocrm_module_commit
    - not espocrm_module_allow_downgrade | bool

- name: Refuse to take the module back from the deployed commit
  ansible.builtin.assert:
    that:
      - espocrm_module_ancestry.rc == 0
    fail_msg: >-
      На сервере модуль {{ espocrm_module_deployed[:12] }}, роль выложила бы {{ espocrm_module_commit[:12] }}:
      {{ 'коммит сервера неизвестен контроллеру' if espocrm_module_ancestry.rc == 128
         else 'это не продолжение коммита сервера' }} (его мог выложить CD из main, D-194). git pull в
      {{ espocrm_module_repo }}; намеренный откат — -e espocrm_module_allow_downgrade=true.
    quiet: true
  when: espocrm_module_ancestry is not skipped

- name: Create the module build directory on the controller
  ansible.builtin.file:
    path: "{{ espocrm_module_build_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Archive the module of the commit on the controller  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: "{{ ['git', '-C', espocrm_module_repo, 'archive', '--format=tar',
               '--output=' ~ espocrm_module_build_dir ~ '/' ~ espocrm_module_tar, espocrm_module_commit, '--']
              + espocrm_module_paths }}"
    creates: "{{ espocrm_module_build_dir }}/{{ espocrm_module_tar }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Copy the module archive to the server
  ansible.builtin.copy:
    src: "{{ espocrm_module_build_dir }}/{{ espocrm_module_tar }}"
    dest: "{{ espocrm_opt_dir }}/module/{{ espocrm_module_tar }}"
    owner: root
    group: root
    mode: "0644"

- name: Create the staging directory of the commit
  ansible.builtin.file:
    path: "{{ espocrm_module_stage }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Как у ядра: маркер завершения после распаковки, иначе rsync --delete удалил бы файлы, которых нет в неполной копии.
- name: Unpack the module of the commit
  ansible.builtin.unarchive:
    src: "{{ espocrm_opt_dir }}/module/{{ espocrm_module_tar }}"
    dest: "{{ espocrm_module_stage }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ espocrm_module_stage }}.complete"

- name: Mark the unpacked module complete
  ansible.builtin.copy:
    content: "{{ espocrm_module_commit }}\n"
    dest: "{{ espocrm_module_stage }}.complete"
    owner: root
    group: root
    mode: "0644"

# --checksum: сравнение по содержимому (время файлов архива — время коммита). Как у ядра: пробный прогон, затем
# отметка apply-pending до изменения файлов (смену коммита apply.yml видит и без неё — по последнему применённому
# состоянию; отметка нужна для исправленного дрейфа файлов при том же коммите).
- name: Compare the module with the EspoCRM root  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      rsync -a --omit-dir-times --delete --checksum --itemize-changes --chown=root:root --chmod=D0755,F0644 --dry-run
      {{ espocrm_module_stage }}/{{ item }}/ {{ espocrm_root }}/{{ item }}/
  loop: "{{ espocrm_module_paths }}"
  register: espocrm_module_diff
  changed_when: ansible_check_mode and espocrm_module_diff.stdout | length > 0  # --check shows the drift here
  check_mode: false

- name: Mark the module apply as pending before the module changes
  ansible.builtin.copy:
    content: "{{ espocrm_module_commit }}\n"
    dest: "{{ espocrm_pending_apply }}"
    owner: root
    group: root
    mode: "0600"
  when: espocrm_module_diff.results | map(attribute='stdout') | select | list | length > 0

- name: Synchronise the module into the EspoCRM root  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      rsync -a --omit-dir-times --delete --checksum --itemize-changes --chown=root:root --chmod=D0755,F0644
      {{ espocrm_module_stage }}/{{ item.item }}/ {{ espocrm_root }}/{{ item.item }}/
  loop: "{{ espocrm_module_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: espocrm_module_sync
  changed_when: espocrm_module_sync.stdout | length > 0
  when: item.stdout | length > 0

- name: Write the module stamp
  ansible.builtin.copy:
    content: "{{ espocrm_module_commit }}\n"
    dest: "{{ espocrm_root }}/.itvolga-module"
    owner: root
    group: root
    mode: "0644"
  register: espocrm_module_stamp

- name: Find staging copies of other commits
  ansible.builtin.find:
    paths: "{{ espocrm_opt_dir }}/module"
    file_type: any
    excludes:
      - "{{ espocrm_module_commit }}"
      - "{{ espocrm_module_commit }}.complete"
      - "{{ espocrm_module_tar }}"
  register: espocrm_module_old

- name: Remove staging copies of other commits
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ espocrm_module_old.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
