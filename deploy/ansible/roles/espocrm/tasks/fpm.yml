---
# Свой мастер PHP-FPM 8.5 (как на стенде): перезапуск EspoCRM не касается php8.5-fpm (Firefly, Mautic) и
# php74-fpm (Vtiger, Lahic). php.ini и расширения — общие для PHP 8.5 (роль php). Рестарт — задачей, не
# обработчиком: flush_handlers посреди роли перезагрузил бы и Apache с промежуточным состоянием переключения.
- name: Deploy the PHP-FPM configuration of EspoCRM
  ansible.builtin.template:
    src: php-fpm.conf.j2
    dest: "{{ espocrm_fpm_config }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ espocrm_php_fpm_bin }} --test --fpm-config %s"
  register: espocrm_fpm_conf

- name: Deploy the PHP-FPM unit of EspoCRM
  ansible.builtin.template:
    src: espocrm-php-fpm.service.j2
    dest: "/etc/systemd/system/{{ espocrm_fpm_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  register: espocrm_fpm_unit_file

- name: Start, enable or restart the PHP-FPM master of EspoCRM
  ansible.builtin.systemd:
    name: "{{ espocrm_fpm_unit }}"
    state: "{{ 'restarted' if (espocrm_fpm_conf is changed or espocrm_fpm_unit_file is changed) else 'started' }}"
    enabled: true
    daemon_reload: "{{ espocrm_fpm_unit_file is changed }}"
