---
# Те же имена и действия, что у обработчиков роли apache: в одном play (12-crm-switch.yml) — один reload в конце.
# PHP-FPM, слушатель и manager reload перезапускаются задачами роли (без flush_handlers посреди play).
- name: Reload Apache
  ansible.builtin.service:
    name: apache2
    state: reloaded

- name: Restart Apache
  ansible.builtin.service:
    name: apache2
    state: restarted

- name: Reload fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: reloaded
