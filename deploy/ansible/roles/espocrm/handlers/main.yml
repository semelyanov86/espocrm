---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart EspoCRM PHP-FPM
  ansible.builtin.systemd:
    name: "{{ espocrm_fpm_unit }}"
    state: restarted

- name: Restart the EspoCRM telephony listener
  ansible.builtin.systemd:
    name: "{{ espocrm_telephony_unit }}"
    state: restarted
  when: espocrm_telephony_enabled | bool

# Новые пользователи AMI — без рестарта Asterisk: идущие звонки не рвутся (telephony.md).
- name: Reload the Asterisk manager
  ansible.builtin.shell:
    cmd: if systemctl is-active --quiet asterisk; then asterisk -rx "manager reload"; fi
  changed_when: true

# Те же имена и действия, что у обработчиков роли apache: в одном play (12-crm-switch.yml) — один reload.
- name: Reload Apache
  ansible.builtin.service:
    name: apache2
    state: reloaded

- name: Restart Apache
  ansible.builtin.service:
    name: apache2
    state: restarted

- name: Reload fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: reloaded
